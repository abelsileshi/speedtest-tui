[package]
name = "speedtest-tui"
version = "0.1.0"
edition = "2021"
description = "A professional-grade Terminal UI application for measuring internet performance"
license = "MIT"
authors = ["speedtest-tui contributors"]

[[bin]]
name = "speedtest-tui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
bytes = "1"
rand = "0.8"
toml = "0.8"
csv = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
