# .github/workflows/release.yml
#
# Triggered whenever you push a tag like v0.1.0
# Builds speedtest-tui for 5 platforms, then creates a GitHub Release
# with all binaries attached as downloadable assets.
#
# Required: no secrets needed — uses the built-in GITHUB_TOKEN.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # e.g. v0.1.0, v1.2.3

env:
  BINARY_NAME: speedtest-tui
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────────────
  # Build matrix — one job per target platform
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: speedtest-tui-linux-x86_64
            archive: tar.gz

          # Linux ARM64 (Raspberry Pi 4, etc.)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: speedtest-tui-linux-aarch64
            archive: tar.gz
            cross: true          # uses cross-rs for cross-compilation

          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-14
            asset_name: speedtest-tui-macos-aarch64
            archive: tar.gz

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            asset_name: speedtest-tui-macos-x86_64
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset_name: speedtest-tui-windows-x86_64
            archive: zip

    steps:
      # ── 1. Check out source ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install Rust toolchain ────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 3. Cache Cargo registry + build artefacts ────────────────
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── 4. Install cross (ARM64 Linux only) ──────────────────────
      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      # ── 5. Build release binary ──────────────────────────────────
      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      # ── 6. Package into archive ──────────────────────────────────
      - name: Package (tar.gz — Linux / macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          BINARY=target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          chmod +x "$BINARY"
          tar -czf ${{ matrix.asset_name }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            ${{ env.BINARY_NAME }} \
            -C ${{ github.workspace }} \
            README.md LICENSE

      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $src = "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe"
          Compress-Archive -Path $src, README.md, LICENSE `
            -DestinationPath "${{ matrix.asset_name }}.zip"

      # ── 7. Upload archive as workflow artefact ───────────────────
      #    (collected by the next job to attach to the GitHub Release)
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # Create GitHub Release and attach all built archives
  # ────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      # Download all archives produced by the build matrix
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List dist/
        run: ls -lh dist/

      # Create the release; body is auto-generated from the tag annotation.
      # Add a CHANGELOG.md or edit the `body` field for custom release notes.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "speedtest-tui ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta → pre-release
          generate_release_notes: true   # auto-generates changelog from merged PRs/commits
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
