name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  BINARY_NAME: speedtest-tui
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: speedtest-tui-linux-x86_64
            archive_ext: tar.gz
            binary_path: target/x86_64-unknown-linux-gnu/release/speedtest-tui
            use_cross: false

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset_name: speedtest-tui-linux-aarch64
            archive_ext: tar.gz
            binary_path: target/aarch64-unknown-linux-gnu/release/speedtest-tui
            use_cross: true

          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: speedtest-tui-macos-aarch64
            archive_ext: tar.gz
            binary_path: target/aarch64-apple-darwin/release/speedtest-tui
            use_cross: false

          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: speedtest-tui-macos-x86_64
            archive_ext: tar.gz
            binary_path: target/x86_64-apple-darwin/release/speedtest-tui
            use_cross: false

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset_name: speedtest-tui-windows-x86_64
            archive_ext: zip
            binary_path: target/x86_64-pc-windows-msvc/release/speedtest-tui.exe
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -lh ${{ matrix.binary_path }}
          test -f ${{ matrix.binary_path }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Item "${{ matrix.binary_path }}"

      - name: Prepare package directory (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf package
          mkdir -p package
          cp "${{ matrix.binary_path }}" "package/${{ env.BINARY_NAME }}"
          chmod +x "package/${{ env.BINARY_NAME }}"
          cp README.md package/
          if [ -f LICENSE ]; then cp LICENSE package/; fi

      - name: Create tar.gz archive
        if: matrix.archive_ext == 'tar.gz'
        run: |
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C package .
          ls -lh "${{ matrix.asset_name }}.tar.gz"

      - name: Prepare package directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path package) { Remove-Item package -Recurse -Force }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item "${{ matrix.binary_path }}" "package\${{ env.BINARY_NAME }}.exe"
          Copy-Item README.md package\
          if (Test-Path LICENSE) { Copy-Item LICENSE package\ }

      - name: Create zip archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          if (Test-Path "${{ matrix.asset_name }}.zip") { Remove-Item "${{ matrix.asset_name }}.zip" -Force }
          Compress-Archive -Path package\* -DestinationPath "${{ matrix.asset_name }}.zip"
          Get-Item "${{ matrix.asset_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release assets
        run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: speedtest-tui ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
